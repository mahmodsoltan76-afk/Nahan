        body {

        [lang="fa"] body { font-family: 'Vazirmatn', sans-serif; }
        
        .bento-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-card) !important;
            box-shadow: var(--shadow-card) !important;
            border-radius: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .bento-inner {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-inner);
            border-radius: 1rem;
            transition: all 0.3s;
        }

        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border-inner);
            color: var(--text-primary);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .btn-primary { background: var(--btn-primary-bg); color: white; transition: all 0.2s ease; }
        .btn-primary:hover { background: var(--btn-primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--btn-secondary-bg); color: var(--text-primary); border: 1px solid var(--border-inner); transition: all 0.2s ease; }
        .btn-secondary:hover { background: var(--btn-secondary-hover); transform: translateY(-1px); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .progress-bar-bg { background: var(--progress-bg); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        
        .modal-overlay { background: var(--modal-bg); backdrop-filter: blur(8px); }
        .modal-card { background: var(--modal-card); border: 1px solid var(--border-card); }
        
        .app-btn {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-inner);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        .app-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        

        .user-initial-logo {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            position: relative;
            background: linear-gradient(145deg, #d4af37 0%, #f7e7a8 28%, #c0c0c0 52%, #f5f5f5 68%, #b7b7b7 82%, #d4af37 100%);
            box-shadow: 0 8px 28px rgba(180, 150, 45, 0.25), inset 0 1px 2px rgba(255,255,255,.85);
            padding: 3px;
        }
        .user-initial-logo::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--bg-card);
        }
        .user-profile-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .user-initial-letter {
            position: relative;
            z-index: 1;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            font-size: 42px;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(135deg, #b8911f 0%, #f3d77a 38%, #c0c0c0 58%, #ffffff 72%, #9e9e9e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
        }
\n        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--accent);
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;

    <div id="qr-modal" class="fixed inset-0 modal-overlay z-50 hidden items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="modal-card max-w-sm w-full rounded-3xl p-6 md:p-8 transform scale-95 transition-transform duration-300 shadow-2xl relative">
            <button onclick="closeQRModal()" class="absolute top-4 right-4 p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                <svg class="w-6 h-6 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-xl font-black mb-6 text-center" style="color: var(--text-primary);" id="qr-title">Scan QR Code</h3>
            <div class="bg-white p-4 rounded-2xl shadow-inner mb-6 mx-auto w-fit">
                <img id="qr-img" src="" alt="QR Code" class="w-48 h-48 sm:w-56 sm:h-56">
            </div>
            <p id="qr-text" class="text-xs text-center text-secondary font-mono break-all mb-6 px-2 bg-black/5 dark:bg-white/5 py-3 rounded-xl border border-inner"></p>
            <button onclick="closeQRModal()" class="btn-primary w-full py-3 rounded-xl font-bold shadow-md" data-i18n="close">Close</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl font-bold text-sm z-50 transition-all transform -translate-y-4 opacity-0 pointer-events-none flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-400 dark:text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>Notification</span>
    </div>

    <script>

        const I18N = {
            en: {
                totalUsage: 'Total Usage',
                dailyUsage: 'Daily Usage',
                expDate: 'Expiration Date',
                calendarLocal: 'Calendar Local',
                unlimitedPlan: 'Unlimited Plan',
                noDailyLimit: 'No Daily Limit',
                integrationTitle: 'Integration Connections',
                integrationDesc: 'Add the correct configuration link based on your preferred format below.',
                universalLink: 'Universal Auto-Detecting Link',
                universalDesc: 'This URL automatically detects your client and delivers the optimal format.',
                oneClickImport: 'One-Click Import',
                copy: 'Copy',
                copyRaw: 'Copy Raw URL',
                qr: 'QR',
                parsedContent: 'Retrieve Raw Content',
                close: 'Close',
                qrTitle: 'Scan QR Code',
                copied: 'Copied to clipboard!',
                decodedCopied: 'Decoded links copied!',
                decodedError: 'Error fetching content',
                used: '% Used',
                active: 'Active',
                paused: 'Paused',
                expired: 'Expired',
                limitExceeded: 'Limit Exceeded',
                dailyLimitExceeded: 'Daily Limit Exceeded',
                availableFormats: 'Available Subscription Formats',
                formatsDesc: 'Use these links to explicitly request specific configuration formats.',
                 daysRemaining: 'days remaining',
                 allowedUsers: 'Allowed Users',
                 unlimitedUsers: 'Unlimited'
            },
            fa: {
                totalUsage: 'مصرف کل',
                dailyUsage: 'مصرف روزانه',
                expDate: 'پایان اشتراک',
                calendarLocal: 'زمان محلی',
                unlimitedPlan: 'طرح نامحدود',
                noDailyLimit: 'بدون محدودیت روزانه',

                universalDesc: 'این لینک کلاینت شما را شناسایی و بهترین فرمت را ارسال می‌کند.',
                oneClickImport: 'وارد کردن با یک کلیک',
                copy: 'کپی',
                copyRaw: 'کپی لینک خام',
                qr: 'QR',
                parsedContent: 'دریافت متن خام',
                close: 'بستن',

                copied: 'کپی شد!',

                used: '% مصرف',

        let currentLang = 'fa';
        let isDark = false;

        function applyTheme() {
            const root = document.documentElement;
            const themeLabel = document.getElementById('theme-label');
            if (isDark) {
                root.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
                if (themeLabel) themeLabel.textContent = currentLang === 'fa' ? 'روشن' : 'Light';
            } else {
                root.classList.remove('dark');
                document.getElementById('theme-icon').textContent = '🌙';
                if (themeLabel) themeLabel.textContent = currentLang === 'fa' ? 'تاریک' : 'Dark';
            }
            try { localStorage.setItem('sub-theme', isDark ? 'dark' : 'light'); } catch(e) {}
        }

        function applyLang() {
            const t = I18N[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            if (currentLang === 'fa') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'fa');
                document.getElementById('lang-icon').textContent = '🇮🇷';
                document.getElementById('lang-label').textContent = 'FA';
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', 'en');
                document.getElementById('lang-icon').textContent = '🇺🇸';
                document.getElementById('lang-label').textContent = 'EN';
            }
            initStatusBadge();
            try { localStorage.setItem('sub-lang', currentLang); } catch(e) {}
        }

        function toggleTheme() {
            isDark = !isDark;
            applyTheme();
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'fa' : 'en';
            applyLang();
            applyTheme();
        }

        // Persian (Jalali) expiry date and countdown
        function toPersianDigits(value) {
            return String(value).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }


        function toPersianDigits(value) {
            return String(value).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function localizeUsageNumbers() {
            document.querySelectorAll('[data-persian-number]').forEach(el => {
                if (!el.dataset.originalNumber) el.dataset.originalNumber = el.textContent.trim();
                el.textContent = toPersianDigits(el.dataset.originalNumber);
            });
        }

        function formatJalaliDate(date) {
            try {
                return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
                    year: 'numeric', month: 'long', day: 'numeric'
                }).format(date);
            } catch (e) {
                return date.toLocaleDateString('fa-IR');
            }
        }

        function parseExpiryDate(raw) {
            const text = String(raw).trim();
            if (/^\d+$/.test(text)) {
                const n = Number(text);
                return new Date(n < 1e12 ? n * 1000 : n);
            }
            const d = new Date(text);
            return isNaN(d.getTime()) ? null : d;
        }

        function updateExpiryInfo() {
            const raw = '__EXPIRY_DATE__';
            const date = parseExpiryDate(raw);
            const dateEl = document.getElementById('expiry-date');
            const gregorianDateEl = document.getElementById('expiry-date-gregorian');
            const countEl = document.getElementById('expiry-countdown');
            if (!date || !dateEl || !countEl) return;

            dateEl.textContent = currentLang === 'fa'
                ? formatJalaliDate(date)
                : date.toLocaleDateString('en-GB');

            if (gregorianDateEl) {
                gregorianDateEl.textContent = `میلادی: ${date.toLocaleDateString('en-GB', {
                    day: '2-digit', month: 'long', year: 'numeric'
                })}`;
            }

            const diff = date.getTime() - Date.now();
            const days = Math.ceil(diff / 86400000);
            const progressBar = document.getElementById('expiry-progress-bar');
            const progressPercent = document.getElementById('expiry-progress-percent');
            const ring = document.getElementById('expiry-ring');
            const dayNumber = document.getElementById('expiry-days-number');
            if (progressBar && progressPercent) {
                const totalDays = Math.max(1, Math.ceil((date.getTime() - new Date().setMonth(new Date().getMonth() - 1)) / 86400000));
                const percent = Math.max(0, Math.min(100, Math.round((days / totalDays) * 100)));
                progressBar.style.width = percent + '%';
                progressPercent.textContent = currentLang === 'fa' ? toPersianDigits(percent) + '%' : percent + '%';
                if (ring) {
                    const circumference = 2 * Math.PI * 43;
                    ring.style.strokeDasharray = circumference;
                    ring.style.strokeDashoffset = circumference * (1 - percent / 100);
                }
                if (dayNumber) dayNumber.textContent = currentLang === 'fa' ? toPersianDigits(Math.max(0, days)) : Math.max(0, days);
            }

            if (currentLang === 'fa') {
                countEl.textContent = days > 0
                    ? `${toPersianDigits(days)} روز باقی‌مانده`
                    : days === 0
                        ? 'امروز منقضی می‌شود'
                        : `${toPersianDigits(Math.abs(days))} روز از انقضا گذشته است`;
            } else {
                countEl.textContent = days > 0
                    ? `${days} days remaining`
                    : days === 0
                        ? 'Expires today'
                        : `${Math.abs(days)} days since expiry`;
            }
        }

        function initStatusBadge() {
            const badge = document.getElementById('status-badge');
            const t = I18N[currentLang];
            const map = {
                active: { en: t.active || 'Active', bg: 'var(--green-bg)', border: 'var(--green-border)', color: 'var(--green-text)' },
                paused: { en: t.paused || 'Paused', bg: 'var(--amber-bg)', border: 'var(--amber-border)', color: 'var(--amber-text)' },
                expired: { en: t.expired || 'Expired', bg: 'var(--red-bg)', border: 'var(--red-border)', color: 'var(--red-text)' },
                limit: { en: t.limitExceeded || 'Limit Exceeded', bg: 'var(--red-bg)', border: 'var(--red-border)', color: 'var(--red-text)' },
                dailyLimit: { en: t.dailyLimitExceeded || 'Daily Limit Exceeded', bg: 'var(--red-bg)', border: 'var(--red-border)', color: 'var(--red-text)' }
            };
            const s = map['__STATUS_CODE__'] || map.active;
            badge.textContent = s.en;
            badge.style.background = s.bg;
            badge.style.borderColor = s.border;
            badge.style.color = s.color;
            badge.style.border = '1px solid ' + s.border;
        }

        function copyLink(id) {
            const el = document.getElementById(id);
            el.select();
            navigator.clipboard.writeText(el.value);
            showToast(I18N[currentLang].copied);
        }

        async function fetchDecodedRawContent() {
            try {
                const res = await fetch('__SYNC_RAW__');
                if(!res.ok) throw new Error('Failed');
                const base64Str = await res.text();
                const decodedText = atob(base64Str.trim());
                await navigator.clipboard.writeText(decodedText);
                showToast(I18N[currentLang].decodedCopied);
            } catch(e) {
                alert(I18N[currentLang].decodedError + ': ' + e.message);
            }
        }

        function showQRModal(url) {
            const t = I18N[currentLang];
            document.getElementById('qr-title').innerText = t.qrTitle;
            document.getElementById('qr-text').innerText = url;
            document.getElementById('qr-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
            
            const modal = document.getElementById('qr-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Animation
            setTimeout(() => {
                modal.style.opacity = '1';
                modal.querySelector('.modal-card').style.transform = 'scale(1)';
            }, 10);
        }

        function closeQRModal() {
            const modal = document.getElementById('qr-modal');
            modal.style.opacity = '0';
            modal.querySelector('.modal-card').style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { 
                t.style.opacity = '0'; 
                t.style.transform = 'translate(-50%, 16px)';
            }, 2500);
        }

        
        // Fetch Client IP
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                let ipEl = document.getElementById('client-ip');
                if(ipEl) ipEl.textContent = data.ip;
            }).catch(e => {
                let ipEl = document.getElementById('client-ip');
                if(ipEl) ipEl.textContent = 'Unknown';
            });

        // آواتار فارسی زیبا: حرف اول و در صورت وجود، حرف اول آخرین بخش نام کاربر


        (function init() {


            applyTheme();
            applyLang();

            updateExpiryInfo();
            localizeUsageNumbers();
            setInterval(updateExpiryInfo, 60000);
            
            // Base64 encode normal link for shadowrocket
            const normalLink = '__SYNC_NORMAL__';
            document.querySelectorAll('a').forEach(a => {
                if(a.href.includes('__SYNC_NORMAL_BASE64__')) {
                    a.href = a.href.replace('__SYNC_NORMAL_BASE64__', btoa(normalLink));
                }
            });

            // One-click import links for supported clients.
            // Keep the subscription URL itself intact and URL-encode only where the
            // target app expects it as a URI component. This avoids malformed deep
            // links when the subscription URL contains its own query string.
            const encodedNormalLink = encodeURIComponent(normalLink);
            const encodedName = encodeURIComponent('__USER_NAME__');

            function setAppLink(id, url) {
                const el = document.getElementById(id);
                if (el) el.href = url;
            }

            // v2rayNG accepts install-sub with the subscription URL as the url query
            // parameter. Omitting the optional name avoids a known deep-link issue
            // on some versions/devices.
            setAppLink('v2rayng-link', 'v2rayng://install-sub?url=' + encodedNormalLink);

            // v2rayN uses the same subscription deep-link form on supported builds.
            const v2raynOneClick = document.querySelector('a[href^="v2rayn://"]');
            if (v2raynOneClick) v2raynOneClick.href = 'v2rayn://install-sub?url=' + encodedNormalLink;

            // NekoBox supports browser deeplinks for subscription groups.
            const nekoboxLink = document.getElementById('nekobox-link');
            if (nekoboxLink) nekoboxLink.href = 'sn://subscription?url=' + encodedNormalLink;

            // These clients expect the subscription URL as the path/query value.
            const happLink = document.getElementById('happ-link');
            if (happLink) happLink.href = 'happ://add/' + normalLink;

            const v2raytunLink = document.getElementById('v2raytun-link');
            if (v2raytunLink) v2raytunLink.href = 'v2raytun://import/' + normalLink;

            const v2boxLink = document.getElementById('v2box-link');
            if (v2boxLink) v2boxLink.href = 'v2box://install-sub?url=' + encodedNormalLink + '&name=' + encodedName;

            const karingOneClick = document.getElementById('karing-link');
            if (karingOneClick) karingOneClick.href = 'karing://install-config?url=' + encodeURIComponent(normalLink) + '&name=' + encodeURIComponent(userName);

            // NPV Tunnel does not expose a documented public web deep-link in the
            // current sources, so its button copies the subscription and opens NPV.
            window.importNPV = async function () {
                try {
                    await navigator.clipboard.writeText(normalLink);
                } catch (e) {
                    const temp = document.createElement('textarea');
                    temp.value = normalLink;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    temp.remove();
                }
                showToast(currentLang === 'fa'
                    ? 'لینک کپی شد؛ NPV Tunnel را باز کنید و Import from Clipboard را بزنید.'
                    : 'Link copied. Open NPV Tunnel and choose Import from Clipboard.');
                setTimeout(() => {
                    try { window.location.href = 'npvtunnel://'; } catch (e) {}
                }, 150);
            };

            // Set base64 flag for v2rayNG link
            const v2rayngLink = document.getElementById('v2rayng-link');
            if (v2rayngLink) {
                const base64Url = normalLink + (normalLink.includes('?') ? '&flag=base64' : '?flag=base64');
                v2rayngLink.href = 'v2rayng://install-sub?url=' + encodeURIComponent(base64Url) + '&name=' + encodeURIComponent('__USER_NAME__');
            }

            // Populate format-specific subscription links
            const rawInput = document.getElementById('link-raw-fmt');
            const base64Input = document.getElementById('link-base64-fmt');
            const singboxInput = document.getElementById('link-singbox-fmt');
            const clashInput = document.getElementById('link-clash-fmt');
            const v2raynInput = document.getElementById('link-v2rayn-fmt');

            const rawUrl = normalLink + (normalLink.includes('?') ? '&flag=raw' : '?flag=raw');
            const base64UrlFmt = normalLink + (normalLink.includes('?') ? '&flag=base64' : '?flag=base64');
            const singboxUrl = normalLink + (normalLink.includes('?') ? '&flag=singbox' : '?flag=singbox');
            const clashUrl = normalLink + (normalLink.includes('?') ? '&flag=clash' : '?flag=clash');
            const v2raynUrl = normalLink + (normalLink.includes('?') ? '&flag=vjson' : '?flag=vjson');

            if (rawInput) rawInput.value = rawUrl;
            if (base64Input) base64Input.value = base64UrlFmt;
            if (singboxInput) singboxInput.value = singboxUrl;
            if (clashInput) clashInput.value = clashUrl;
            if (v2raynInput) v2raynInput.value = v2raynUrl;

            const formatLinks = {
                'link-raw-open': rawUrl,
                'link-base64-open': base64UrlFmt,
                'link-singbox-open': singboxUrl,
                'link-clash-open': clashUrl,
                'link-v2rayn-open': v2raynUrl
            };
            Object.entries(formatLinks).forEach(([id, url]) => {
                const link = document.getElementById(id);
                if (link) {
                    link.href = url;
                    link.setAttribute('data-url', url);
                }
            });
        })();
